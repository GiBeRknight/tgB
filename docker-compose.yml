services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      BOOKING_CONTACT_ID: ${BOOKING_CONTACT_ID:-1746576470}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: bot
      DB_PASSWORD: bot
      DB_NAME: bot

volumes:
  pgdata:
